version: 2.1

executors:
  python-node-executor:
    docker:
      - image: cimg/python:3.11-node
    working_directory: ~/project

jobs:
  lint:
    executor: python-node-executor
    steps:
      - checkout
      - restore_cache:
          keys:
            data-{{ checksum "requirements.txt" }}
      - run:
          name: Install Dependencies
          command: |
            python -m venv .venv
            .venv/bin/pip install --upgrade pip
            .venv/bin/pip install -r requirements.txt
            .venv/bin/pip install ruff
      - run:
          name: Run Python Linter (Ruff)
          command: |
            .venv/bin/ruff check .

  synth:
    executor: python-node-executor
    steps:
      - checkout
      - run:
          name: Install Node.js CDK CLI & Python Dependencies
          command: |
            sudo npm install -g aws-cdk
            python -m venv .venv
            .venv/bin/pip install --upgrade pip
            .venv/bin/pip install -r requirements.txt
      - run:
          name: Run AWS CDK Synthesis
          command: |
            .venv/bin/activate
            cdk synth

workflows:
  validate-infrastructure:
    jobs:
      - lint
      - synth:
          requires:
            - lint